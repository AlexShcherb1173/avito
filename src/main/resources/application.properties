spring.datasource.url=jdbc:postgresql://localhost:5432/graduate_work
spring.datasource.username=Admin
spring.datasource.password=Admin
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8082
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.show-actuator=false
springdoc.swagger-ui.oauth.client-id=test
springdoc.swagger-ui.oauth.client-secret=test


springdoc.swagger-ui.oauth2-redirect-url=/swagger-ui/oauth2-redirect.html
springdoc.swagger-ui.csrf.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
upload.path=./uploads
liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml