databaseChangeLog:
  - changeSet:
      id: 1
      author: skypro
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: SERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(18)
              - column:
                  name: role
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: image
                  type: TEXT
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - createTable:
            tableName: ads
            columns:
              - column:
                  name: id
                  type: SERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(64)
              - column:
                  name: image
                  type: TEXT
              - column:
                  name: author_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ads_author
                    references: users(id)

        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: SERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_author
                    references: users(id)
              - column:
                  name: ad_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_ad
                    references: ads(id)

        - createIndex:
            indexName: idx_ads_author_id
            tableName: ads
            columns:
              - column:
                  name: author_id

        - createIndex:
            indexName: idx_comments_ad_id
            tableName: comments
            columns:
              - column:
                  name: ad_id

        - createIndex:
            indexName: idx_comments_author_id
            tableName: comments
            columns:
              - column:
                  name: author_id