databaseChangeLog:
  - changeSet:
      id: 002-ads
      author: you
      changes:
        - createTable:
            tableName: ads
            columns:
              - column: {name: id, type: SERIAL, constraints: {primaryKey: true, nullable: false}}
              - column: {name: title, type: VARCHAR(32), constraints: {nullable: false}}
              - column: {name: price, type: INTEGER, constraints: {nullable: false}}
              - column: {name: description, type: VARCHAR(64), constraints: {nullable: false}}
              - column: {name: image, type: VARCHAR(255)}
              - column: {name: author_id, type: INTEGER, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: ads
            baseColumnNames: author_id
            constraintName: fk_ads_author
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
