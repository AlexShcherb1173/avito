databaseChangeLog:
  - changeSet:
      id: 003-comments
      author: you
      changes:
        - createTable:
            tableName: comments
            columns:
              - column: {name: id, type: SERIAL, constraints: {primaryKey: true, nullable: false}}
              - column: {name: author_id, type: INTEGER, constraints: {nullable: false}}
              - column: {name: ad_id, type: INTEGER, constraints: {nullable: false}}
              - column: {name: text, type: VARCHAR(64), constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: author_id
            constraintName: fk_comments_author
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: ad_id
            constraintName: fk_comments_ad
            referencedTableName: ads
            referencedColumnNames: id
            onDelete: CASCADE
