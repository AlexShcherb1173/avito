openapi: 3.0.3

info:
  title: Avito API Documentation
  version: "1.0"

servers:
  - url: http://localhost:8081

paths:
  /register:
    post:
      tags:
        - Регистрация
      summary: Регистрация пользователя
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request

  /login:
    post:
      tags:
        - Авторизация
      summary: Авторизация пользователя
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /users/me:
    get:
      tags:
        - Пользователи
      summary: Получение информации об авторизованном пользователе
      operationId: getUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

    patch:
      tags:
        - Пользователи
      summary: Обновление информации об авторизованном пользователе
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /users/me/image:
    patch:
      tags:
        - Пользователи
      summary: Обновление аватара авторизованного пользователя
      operationId: updateUserImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '401':
          description: Unauthorized

  /users/set_password:
    patch:
      tags:
        - Пользователи
      summary: Обновление пароля
      operationId: setPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPassword'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /ads:
    get:
      tags:
        - Объявления
      summary: Получение всех объявлений
      operationId: getAllAds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ads'

    post:
      tags:
        - Объявления
      summary: Добавление объявления
      operationId: addAd
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
                - properties
              properties:
                properties:
                  $ref: '#/components/schemas/CreateOrUpdateAd'
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
        '401':
          description: Unauthorized

  /ads/me:
    get:
      tags:
        - Объявления
      summary: Получение объявлений авторизованного пользователя
      operationId: getAdsMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ads'
        '401':
          description: Unauthorized

  /ads/{id}:
    get:
      tags:
        - Объявления
      summary: Получение информации об объявлении
      operationId: getAdById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedAd'
        '401':
          description: Unauthorized
        '404':
          description: Not found

    patch:
      tags:
        - Объявления
      summary: Обновление информации об объявлении
      operationId: updateAd
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateAd'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      tags:
        - Объявления
      summary: Удаление объявления
      operationId: removeAd
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /ads/{id}/image:
    patch:
      tags:
        - Объявления
      summary: Обновление картинки объявления
      operationId: updateAdImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /ads/{id}/comments:
    get:
      tags:
        - Комментарии
      summary: Получение комментариев объявления
      operationId: getComments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comments'
        '401':
          description: Unauthorized
        '404':
          description: Not found

    post:
      tags:
        - Комментарии
      summary: Добавление комментария к объявлению
      operationId: addComment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateComment'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /ads/{adId}/comments/{commentId}:
    patch:
      tags:
        - Комментарии
      summary: Обновление комментария
      operationId: updateComment
      parameters:
        - name: adId
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateComment'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      tags:
        - Комментарии
      summary: Удаление комментария
      operationId: deleteComment
      parameters:
        - name: adId
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

components:
  schemas:
    NewPassword:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          description: текущий пароль
          minLength: 4
          maxLength: 64
        newPassword:
          type: string
          description: новый пароль
          minLength: 4
          maxLength: 64

    Register:
      type: object
      required:
        - username
        - password
        - firstName
        - lastName
        - phone
      properties:
        username:
          type: string
          description: логин/email
          minLength: 4
          maxLength: 64
        password:
          type: string
          description: пароль
          minLength: 4
          maxLength: 64
        firstName:
          type: string
          description: имя пользователя
          minLength: 2
          maxLength: 64
        lastName:
          type: string
          description: фамилия пользователя
          minLength: 2
          maxLength: 64
        phone:
          type: string
          description: телефон пользователя
        role:
          type: string
          description: роль пользователя
          enum:
            - USER
            - ADMIN

    Login:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: логин/email
          minLength: 4
          maxLength: 64
        password:
          type: string
          description: пароль
          minLength: 4
          maxLength: 64

    UpdateUser:
      type: object
      required:
        - firstName
        - lastName
        - phone
      properties:
        firstName:
          type: string
          description: имя пользователя
          minLength: 2
          maxLength: 64
        lastName:
          type: string
          description: фамилия пользователя
          minLength: 2
          maxLength: 64
        phone:
          type: string
          description: телефон пользователя

    User:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: id пользователя
        email:
          type: string
          description: логин пользователя
        firstName:
          type: string
          description: имя пользователя
        lastName:
          type: string
          description: фамилия пользователя
        phone:
          type: string
          description: телефон пользователя
        role:
          type: string
          description: роль пользователя
          enum:
            - USER
            - ADMIN
        image:
          type: string
          nullable: true
          description: ссылка на аватар пользователя

    CreateOrUpdateAd:
      type: object
      required:
        - title
        - price
        - description
      properties:
        title:
          type: string
          description: заголовок объявления
          minLength: 4
          maxLength: 64
        price:
          type: integer
          format: int32
          description: цена объявления
          minimum: 0
          maximum: 10000000
        description:
          type: string
          description: описание объявления
          minLength: 4
          maxLength: 1000

    Ad:
      type: object
      properties:
        author:
          type: integer
          format: int32
          description: id автора объявления
        image:
          type: string
          nullable: true
          description: ссылка на картинку объявления
        pk:
          type: integer
          format: int32
          description: id объявления
        price:
          type: integer
          format: int32
          description: цена объявления
        title:
          type: string
          description: заголовок объявления

    Ads:
      type: object
      properties:
        count:
          type: integer
          format: int32
          description: общее количество объявлений
        results:
          type: array
          items:
            $ref: '#/components/schemas/Ad'

    ExtendedAd:
      type: object
      properties:
        pk:
          type: integer
          format: int32
          description: id объявления
        title:
          type: string
          description: заголовок объявления
        description:
          type: string
          description: описание объявления
        price:
          type: integer
          format: int32
          description: цена объявления
        image:
          type: string
          nullable: true
          description: ссылка на картинку объявления
        authorFirstName:
          type: string
          description: имя автора объявления
        authorLastName:
          type: string
          description: фамилия автора объявления
        email:
          type: string
          description: логин автора объявления
        phone:
          type: string
          description: телефон автора объявления

    CreateOrUpdateComment:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: текст комментария
          minLength: 1
          maxLength: 1000

    Comment:
      type: object
      properties:
        author:
          type: integer
          format: int32
          description: id автора комментария
        authorImage:
          type: string
          nullable: true
          description: ссылка на аватар автора комментария
        authorFirstName:
          type: string
          description: имя создателя комментария
        createdAt:
          type: integer
          format: int64
          description: дата и время создания комментария в миллисекундах с 00:00:00 01.01.1970
        pk:
          type: integer
          format: int32
          description: id комментария
        text:
          type: string
          description: текст комментария

    Comments:
      type: object
      properties:
        count:
          type: integer
          format: int32
          description: общее количество комментариев
        results:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    ImageResponse:
      type: object
      properties:
        image:
          type: string
          description: ссылка на изображение