services:
  avito-db:
    image: postgres:17
    container_name: avito-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - avito_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - avito-net

  avito-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avito-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_IMAGES_DIR: ${APP_IMAGES_DIR}
    depends_on:
      avito-db:
        condition: service_healthy
    volumes:
      - avito_images_data:/images
    ports:
      - "8081:8081"
    networks:
      - avito-net

  avito-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: avito-frontend
    restart: unless-stopped
    depends_on:
      - avito-backend
    ports:
      - "3000:80"
    networks:
      - avito-net

volumes:
  avito_postgres_data:
  avito_images_data:

networks:
  avito-net:
    driver: bridge