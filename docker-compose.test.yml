version: '3.8'
services:
  # PostgreSQL для тестов
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_DB: avito_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Фронтенд (используем ваш существующий образ)
  frontend-test:
    image: ghcr.io/dmitry-bizin/front-react-avito:v1.21
    ports:
      - "3001:3000"
    depends_on:
      postgres-test:
        condition: service_healthy

  # Selenium для UI тестов
  selenium:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
    shm_size: '2g'
    networks:
      - test-network

  # Ваше приложение (бэкенд) - будем собирать из исходников
  app-test:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/avito_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8080
    depends_on:
      postgres-test:
        condition: service_healthy
      frontend-test:
        condition: service_started
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
